import { useState, useEffect } from "react";

function App() {

  const [age, setAge]=useState("");

  useEffect(() => {

  }, [age]);

  return (
    <>
      <input type="number" value={age}
        onChange={(e) => setAge(e.target.value)}
      />

      <h2>{age>=18 ? "Adult":"Minor"}</h2>
    </>
  );
}

export default App;
